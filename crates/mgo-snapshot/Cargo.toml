[package]
name = "mgo-snapshot"
version = "0.1.0"
authors = ["Mango Team <team@mango.io>"]
license = "Apache-2.0"
edition = "2021"
description = "Mango blockchain snapshot-based rollback system"

[dependencies]
# Core async runtime
tokio = { version = "1.32", features = ["full"] }
tokio-stream = "0.1"

# Serialization and data handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging and metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Compression
zstd = { version = "0.13", optional = true }
lz4_flex = { version = "0.11", optional = true }

# Cryptography and hashing
blake3 = "1.5"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# File system operations
tempfile = "3.8"
flate2 = { version = "1.0", optional = true }

# Concurrency
parking_lot = "0.12"
arc-swap = "1.6"
async-trait = "0.1"

# Configuration
config = "0.14"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Byte utilities
bytes = "1.5"

# Performance optimization dependencies
tokio-util = { version = "0.7", features = ["codec"] }
crc32fast = "1.3"
lz4 = { version = "1.24", optional = true }
num_cpus = "1.16"

# HTTP and API
axum = { version = "0.6", features = ["json", "tokio"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["cors", "trace"] }
hyper = { version = "0.14", features = ["full"] }
reqwest = { version = "0.11", features = ["json"], default-features = false }

# Additional dependencies for existing modules (backward compatibility)
integer-encoding = { workspace = true }
indicatif = { workspace = true }
bcs = { workspace = true }
byteorder = { workspace = true }
num_enum = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
prometheus = { workspace = true }
typed-store = { workspace = true }
fastcrypto = { workspace = true, features = ["copy_key"] }

# Mango dependencies
mgo-types = { path = "../mgo-types" }
mgo-core = { path = "../mgo-core" }
mgo-config = { path = "../mgo-config" }
mgo-storage = { path = "../mgo-storage" }
mgo-protocol-config = { path = "../mgo-protocol-config" }
shared-crypto = { path = "../shared-crypto", optional = true }

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"
pretty_assertions = "1.4"

[features]
default = ["compression", "encryption", "api", "metrics"]
compression = ["dep:zstd", "dep:lz4_flex", "dep:flate2", "dep:lz4"]
encryption = ["dep:shared-crypto"]
distributed = []
api = []
metrics = []
test-utils = []